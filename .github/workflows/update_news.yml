name: Daily Morning News Crawler

on:
  schedule:
    # 매일 아침 06:00 KST (UTC 21:00)
    - cron: '0 21 * * *'
    # 매일 아침 07:30 KST (UTC 22:30)
    - cron: '30 22 * * *'
  workflow_dispatch: # 언제든 깃허브 웹에서 수동으로 'Run workflow' 버튼 클릭 가능

permissions:
  contents: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Latest 10 News
        run: |
          python fetch_news.py --force --no-browser

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html morning_news.html last_run.json
          git commit -m "Auto-update morning news: $(date '+%Y-%m-%d %H:%M:%S')" || exit 0
          git push
